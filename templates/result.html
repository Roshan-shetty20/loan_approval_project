<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Prediction Result | SmartLoan AI</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

<nav class="navbar navbar-dark bg-primary shadow">

<div class="container">

<a class="navbar-brand fw-bold" href="/">

🏦 SmartLoan AI

</a>

</div>

</nav>

<div class="container mt-5">

<div class="row justify-content-center">

<div class="col-lg-7">

<div class="card shadow-lg border-0 text-center">

<div class="card-body p-5">

{% if "Approved" in prediction %}

<i class="bi bi-check-circle-fill text-success display-1"></i>

<h1 class="text-success mt-3">

Loan Approved

</h1>

{% else %}

<i class="bi bi-x-circle-fill text-danger display-1"></i>

<h1 class="text-danger mt-3">

Loan Rejected

</h1>

{% endif %}

<p class="lead mt-3">

Prediction Confidence

</p>

<div class="progress mb-4" style="height:30px;">

<div
class="progress-bar bg-primary progress-bar-striped progress-bar-animated"
style="width: {{ confidence }}%;">

{{ confidence }}%

</div>

</div>

<div class="alert alert-light border">

<h5>

Prediction

</h5>

<h3>

{{ prediction }}

</h3>

</div>

<div class="mt-4">

<a href="/"

class="btn btn-primary btn-lg">

<i class="bi bi-arrow-repeat"></i>

Predict Again

</a>

</div>

</div>

</div>

</div>

</div>

<footer class="text-center mt-5 mb-3">

<hr>

<p class="text-muted">

© 2026 SmartLoan AI

</p>

<small>

Built with Flask • Scikit-Learn • Docker • Render

</small>

</footer>

</div>

</body>

</html>
